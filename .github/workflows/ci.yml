name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run content:check
      - run: npm run build
      - name: Bundle size budget (main chunk at most 1.25 MB)
        run: |
          size=$(find dist/assets -name 'index-*.js' -printf '%s\n' | sort -n | tail -1)
          echo "Main chunk: $size bytes"
          test "$size" -le 1310720
