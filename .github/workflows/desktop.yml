name: Desktop app

# Compiles and tests the Tauri PC app when its code changes. Installers are not built here.
on:
  pull_request:
    paths: ['src-tauri/**', 'src/desktop/**', '.github/workflows/desktop.yml']
  push:
    branches: [main]
    paths: ['src-tauri/**', 'src/desktop/**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: System libraries for Tauri
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
